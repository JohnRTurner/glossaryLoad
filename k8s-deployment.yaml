apiVersion: v1
kind: Namespace
metadata:
  name: datahub-tools
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: datahub-glossary-manager-config
  namespace: datahub-tools
data:
  # DataHub GMS URL
  DATAHUB_GMS_URL: "http://datahub-datahub-gms:8080"  # Adjust to your DataHub GMS service name
---
apiVersion: v1
kind: Secret
metadata:
  name: datahub-glossary-manager-secrets
  namespace: datahub-tools
type: Opaque
data:
  # Base64 encoded DataHub token
  # Replace with your actual token by running: echo -n "your-token" | base64
  DATAHUB_TOKEN: ""  # Add your base64 encoded token here
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: datahub-glossary-manager-data
  namespace: datahub-tools
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: datahub-glossary-manager-job
  namespace: datahub-tools
spec:
  template:
    spec:
      containers:
        - name: glossary-manager
          image: datahub-glossary-manager:latest
          imagePullPolicy: IfNotPresent
          args: ["--csv-file", "/data/glossary.csv"]
          volumeMounts:
            - name: data-volume
              mountPath: /data
          envFrom:
            - configMapRef:
                name: datahub-glossary-manager-config
            - secretRef:
                name: datahub-glossary-manager-secrets
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: datahub-glossary-manager-data
      restartPolicy: OnFailure
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: datahub-glossary-manager-cronjob
  namespace: datahub-tools
spec:
  # Schedule to run daily at midnight
  schedule: "0 0 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: glossary-manager
              image: datahub-glossary-manager:latest
              imagePullPolicy: IfNotPresent
              args: ["--csv-file", "/data/glossary.csv"]
              volumeMounts:
                - name: data-volume
                  mountPath: /data
              envFrom:
                - configMapRef:
                    name: datahub-glossary-manager-config
                - secretRef:
                    name: datahub-glossary-manager-secrets
          volumes:
            - name: data-volume
              persistentVolumeClaim:
                claimName: datahub-glossary-manager-data
          restartPolicy: OnFailure