apiVersion: v1
kind: ConfigMap
metadata:
  name: datahub-glossary-manager-config
data:
  # DataHub GMS URL
  DATAHUB_GMS_URL: "http://datahub-datahub-gms:8080"  # Adjust to your DataHub GMS service name
---
apiVersion: v1
kind: Secret
metadata:
  name: datahub-glossary-manager-secrets
type: Opaque
data:
  # Base64 encoded DataHub token
  # Replace with your actual token by running: echo -n "your-token" | base64
  DATAHUB_TOKEN: ""  # Add your base64 encoded token here